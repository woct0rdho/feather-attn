[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sageattention"
version = "0.1.0"
description = "Fake sageattention shim that redirects SageAttention calls to FeatherAttention (ROCm-only)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
# No hard dependency on torch or feather_attn: the shim degrades gracefully (raising a
# RuntimeError at call time) when feather_attn is not importable.
dependencies = []

[tool.setuptools]
packages = ["sageattention"]